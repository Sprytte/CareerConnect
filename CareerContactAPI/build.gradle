plugins {
    id 'java'
    id 'org.springframework.boot' version '3.1.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'CareerContactAPI'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

ext {
    mapstructVersion = "1.5.3.Final"
//    lombokVersion = "1.18.26"
    lombokMapstructBindingVersion = "0.2.0"
}

repositories {
    mavenCentral()
}

// TODO click on the little elephant whenever modifying this file
dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-web-services'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation "org.mapstruct:mapstruct:${mapstructVersion}"

    //TODO change below so that it uses data- for mysql
    implementation 'org.xerial:sqlite-jdbc:3.41.2.2' //DB
    implementation 'org.hibernate.orm:hibernate-community-dialects' //DB
    implementation 'org.json:json:20231013' // json
    implementation 'javax.xml.bind:jaxb-api:2.4.0-b180830.0359'
    implementation 'com.okta.spring:okta-spring-boot-starter:3.0.5' // auth
    implementation "org.apache.httpcomponents.client5:httpclient5:5.2.1"
    implementation 'commons-io:commons-io:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:3.14.0' // auth
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310' // mapper
    implementation 'org.springframework.boot:spring-boot-starter-mail:3.1.2'
    implementation 'com.amazonaws:aws-java-sdk:1.12.429'

    compileOnly 'org.projectlombok:lombok'
    compileOnly "org.mapstruct:mapstruct-processor:${mapstructVersion}"
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}",
            "org.projectlombok:lombok",
            "org.projectlombok:lombok-mapstruct-binding:${lombokMapstructBindingVersion}"
    //TODO sqlite is optional, TBD
    runtimeOnly 'org.xerial:sqlite-jdbc'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}
