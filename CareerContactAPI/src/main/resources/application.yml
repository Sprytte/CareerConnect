# Default Spring Profile
server:
  port: 8080
  error:
    include-message: always

frontend:
  url: http://localhost:3000/

backend:
  url: http://localhost:8080/

website:
  domain: localhost

logging:
  level:
    root: INFO
    com.example: DEBUG

spring:
  config:
    activate:
      on-profile: default
# TODO modify for mysql/sqlite
  datasource:
    driver-class-name: org.sqlite.JDBC
    url: jdbc:sqlite:memory:myDb
    username: username
    password: pwd

---
