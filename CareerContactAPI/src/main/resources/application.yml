    root: INFO
    com.example: DEBUG

server:
  error:
    whitelabel:
      enabled: false
    include-binding-errors: always
    include-message: always
  port: 8080

frontend:
  url: http://localhost:3000/

backend:
  url: http://localhost:8080/

website:
  domain: localhost

spring.datasource.hikari.initializationFailTimeout: 60000
